{# noteの最新記事。profile.md の <!--note-articles--> に差し込まれる #}
{% if articles %}
<ul class="note-list">
  {% for article in articles %}
  <li class="note-item">
    <a class="note-item__link" href="{{ article.url }}" target="_blank" rel="noopener noreferrer">
      {% if article.thumbnail %}
      <img class="note-item__thumb" src="{{ article.thumbnail }}" alt="" loading="lazy" />
      {% endif %}
      <span class="note-item__body">
        <span class="note-item__title">{{ article.title }}</span>
        {% if article.date %}
        <time class="note-item__date" datetime="{{ article.date }}">{{ article.date }}</time>
        {% endif %}
      </span>
    </a>
  </li>
  {% endfor %}
</ul>
<p class="repo-more">
  <a href="{{ note_url }}" target="_blank" rel="noopener noreferrer">note ですべて見る →</a>
</p>
{% else %}
<p class="repo-more">
  <a href="{{ note_url }}" target="_blank" rel="noopener noreferrer">note の記事を見る →</a>
</p>
{% endif %}
